services:
  - type: web
    name: ai-chatbot-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.run
    
    autoDeploy: false
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health

  - type: web
    name: ai-chatbot-frontend
    env: static
    buildCommand: |
      BACKEND_HOST=$(echo $BACKEND_HOST)
      cd frontend && npm ci && VITE_API_BASE_URL="https://$BACKEND_HOST" npm run build
    staticPublishPath: frontend/dist
    
    autoDeploy: false
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: ai-chatbot-backend
          type: web
          property: host

